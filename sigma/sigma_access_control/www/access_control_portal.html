<!-- sigma/sigma/sigma_access_control/www/access_control_portal.html -->
<h1>{{ title }}</h1>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Employee</th>
            <th>Card ID</th>
            <th>Access Point</th>
            <th>Result</th>
            <th>Timestamp</th>
        </tr>
    </thead>
    <tbody>
        {% for event in access_events %}
        <tr>
            <td>{{ event.employee }}</td>
            <td>{{ event.card_id }}</td>
            <td>{{ event.access_point }}</td>
            <td>{{ event.result }}</td>
            <td>{{ event.timestamp }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
