{% extends "templates/web.html" %}

{% block title %}Sigma - Security Management System{% endblock %}

{% block head_include %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23003d7a'>Σ</text></svg>">
    <link rel="stylesheet" href="/assets/sigma/dist/css/index-8c729d21.css">
    <style>
        /* Ensure full width usage */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        /* Override Bootstrap container width limitations */
        @media (min-width: 576px) {
            .container-sm, .container {
                max-width: none !important;
            }
        }

        @media (min-width: 768px) {
            .container-md, .container-sm, .container {
                max-width: none !important;
            }
        }

        @media (min-width: 992px) {
            .container-lg, .container-md, .container-sm, .container {
                max-width: none !important;
            }
        }

        @media (min-width: 1200px) {
            .container-xl, .container-lg, .container-md, .container-sm, .container {
                max-width: none !important;
            }
        }

        @media (min-width: 1400px) {
            .container-xxl, .container-xl, .container-lg, .container-md, .container-sm, .container {
                max-width: none !important;
            }
        }

        /* Override Bootstrap container padding */
        @media (min-width: 992px) {
            .container {
                padding-left: 0 !important;
                padding-right: 0 !important;
            }
        }

        /* Override Bootstrap margin utilities */
        .mb-4, .my-4 {
            margin-bottom: 0 !important;
        }

        .mt-4, .my-4 {
            margin-top: 0 !important;
        }

        /* Hide Frappe navigation/footer for full-screen app */
        .navbar, .sidebar, .page-head, .web-footer, footer, .footer, .website-footer {
            display: none !important;
        }

        .layout-main {
            margin-left: 0 !important;
            padding: 0 !important;
        }

        /* Loading State */
        .sigma-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 18px;
            color: #666;
        }

        .sigma-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #003d7a;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
{% endblock %}

{% block page_content %}
<div id="app">
    <div class="sigma-loading">
        <div class="sigma-spinner"></div>
        <span>Loading Sigma...</span>
    </div>
</div>
{% endblock %}

{% block script %}
<script type="module" src="/assets/sigma/dist/js/index.js?v={{ frappe.utils.now() }}"></script>
<script>
    console.log('Sigma: Page loaded successfully');

    // Check if the app initialized successfully
    setTimeout(() => {
        const appDiv = document.getElementById('app');
        if (!appDiv || appDiv.innerHTML.includes('sigma-loading')) {
            console.error('Sigma: Failed to load application');
            appDiv.innerHTML = `
                <div class="sigma-loading">
                    <div style="color: #f56c6c; margin-bottom: 20px;">
                        <h3>Application Loading Error</h3>
                        <p>The Sigma application failed to load. Please try:</p>
                        <ul style="text-align: left;">
                            <li>Refreshing the page</li>
                            <li>Clearing your browser cache</li>
                            <li>Accessing through Frappe Desk instead</li>
                        </ul>
                    </div>
                    <a href="/app" style="color: #0084ff;">Go to Frappe Desk</a>
                </div>
            `;
        } else {
            console.log('Sigma: Application loaded successfully');
        }
    }, 3000);
</script>
{% endblock %}
