<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Sigma - Security Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%230084ff'>Σ</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        #app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Styles */
        .sigma-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(135deg, #0084ff 0%, #0066cc 100%);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .sigma-header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            user-select: none;
        }

        .sigma-header-logo:hover {
            opacity: 0.9;
        }

        .sigma-header-title {
            margin-left: 10px;
            font-size: 18px;
            font-weight: 600;
        }

        .sigma-toggle-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 5px 10px;
            margin-right: 10px;
            display: none;
        }

        .sigma-toggle-btn:hover {
            opacity: 0.8;
        }

        /* Sidebar Styles */
        .sigma-sidebar {
            position: fixed;
            left: 0;
            top: 60px;
            width: 250px;
            height: calc(100vh - 60px);
            background: #2c3e50;
            color: white;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 999;
        }

        .sigma-sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sigma-sidebar-menu {
            list-style: none;
            padding: 20px 0;
        }

        .sigma-sidebar-menu-item {
            padding: 0;
            margin: 0;
        }

        .sigma-sidebar-menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #ecf0f1;
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .sigma-sidebar-menu-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-left-color: #0084ff;
            padding-left: 17px;
        }

        .sigma-sidebar-menu-link.active {
            background-color: rgba(0, 132, 255, 0.2);
            border-left-color: #0084ff;
            color: #0084ff;
        }

        .sigma-sidebar-menu-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        /* Main Content Styles */
        .sigma-main {
            margin-left: 250px;
            margin-top: 60px;
            flex: 1;
            overflow-y: auto;
            background-color: #f5f5f5;
        }

        .sigma-main.expanded {
            margin-left: 0;
        }

        .sigma-content {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sigma-toggle-btn {
                display: block;
            }

            .sigma-sidebar {
                width: 100%;
                box-shadow: -2px 0 8px rgba(0, 0, 0, 0.2);
            }

            .sigma-main {
                margin-left: 0;
            }

            .sigma-content {
                padding: 20px;
            }

            .sigma-header-title {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .sigma-header {
                padding: 0 10px;
            }

            .sigma-content {
                padding: 15px;
            }

            .sigma-sidebar-menu-link {
                padding: 10px 15px;
            }
        }

        /* Loading State */
        .sigma-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 18px;
            color: #666;
        }

        .sigma-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0084ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="sigma-loading">
            <div class="sigma-spinner"></div>
            <span>Loading Sigma...</span>
        </div>
    </div>

    <script type="module" src="/assets/sigma/dist/js/index.js"></script>
    <link rel="stylesheet" href="/assets/sigma/dist/css/index-79ffa11f.css">
</body>
</html>
