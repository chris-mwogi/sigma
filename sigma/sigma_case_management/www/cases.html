{% extends "templates/website.html" %}

{% block content %}
<h2>My Cases</h2>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Case</th>
            <th>Status</th>
            <th>Type</th>
        </tr>
    </thead>
    <tbody>
        {% for c in cases %}
        <tr>
            <td><a href="/case/{{ c.name }}">{{ c.name }}</a></td>
            <td>{{ c.status }}</td>
            <td>{{ c.case_type }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
